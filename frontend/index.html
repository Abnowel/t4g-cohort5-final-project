<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jewelry Order & Inventory Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Jewelry Order & Inventory Management System</h1>
        <p>Manage customers, jewelry inventory, and orders</p>
    </header>

    <main>

        <section class="dashboard">
            <div class="card">
                <h2>Customers</h2>
                <p id="customer-count">0</p>
            </div>

            <div class="card">
                <h2>Jewelry Items</h2>
                <p id="jewelry-count">0</p>
            </div>

            <div class="card">
                <h2>Orders</h2>
                <p id="order-count">0</p>
            </div>

            <div class="card">
                <h2>Total Sales</h2>
                <p id="sales-total">GHS 0.00</p>
            </div>

        </section>

        <section class="content-section">

            <div class="section-header">
                <h2>Customers</h2>

                <button id="show-customer-form">
                    + Add Customer
                </button>
            </div>

            <form id="customer-form" class="customer-form">

                <input type="hidden" id="customer-id">

                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input
                        type="text"
                        id="first-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input
                        type="text"
                        id="last-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone-number">Phone Number</label>
                    <input
                        type="text"
                        id="phone-number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input
                        type="text"
                        id="address"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="customer-submit-button">
                        Save Customer
                    </button>

                    <button
                        type="button"
                        id="cancel-customer-form"
                    >
                        Cancel
                    </button>
                </div>

            </form>

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Address</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="customer-table-body">
                        <!-- Customers will be added here by JavaScript -->
                    </tbody>

                </table>

            </div>

        </section>
        <section class="content-section">

            <div class="section-header">
                <h2>Jewelry Items</h2>

                <button id="show-jewelry-form">
                    + Add Jewelry
                </button>
            </div>
            <form id="jewelry-form" class="customer-form">

                <input type="hidden" id="jewelry-id">

                <div class="form-group">
                    <label for="jewelry-name">Name</label>
                    <input
                        type="text"
                        id="jewelry-name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="jewelry-category">Category</label>
                    <select id="jewelry-category" required>
                        <option value="">Select category</option>
                        <option value="ring">Ring</option>
                        <option value="necklace">Necklace</option>
                        <option value="bracelet">Bracelet</option>
                        <option value="earrings">Earrings</option>
                        <option value="anklet">Anklet</option>
                        <option value="pendant">Pendant</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="jewelry-material">Material</label>
                    <input
                        type="text"
                        id="jewelry-material"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="jewelry-price">Price</label>
                    <input
                        type="number"
                        id="jewelry-price"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="jewelry-stock">Stock Quantity</label>
                <input
                    type="number"
                    id="jewelry-stock"
                        min="0"
                        required
                    >
                </div>

                <div class="form-actions">
                    <button type="submit" id="jewelry-submit-button">
                        Save Jewelry
                    </button>

                    <button
                        type="button"
                        id="cancel-jewelry-form"
                    >
                        Cancel
                    </button>
                </div>

            </form>
            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Material</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="jewelry-table-body">
                        <!-- Jewelry items will be added here -->
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
